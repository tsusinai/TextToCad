name: Backend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest fastapi pydantic
      - name: Run text-to-CAD contract tests
        run: pytest -q backend/test_quality.py
